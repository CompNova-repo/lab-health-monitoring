machines:
  gcp_14_july:
    thresholds:
      ram: 90
      disk: 85
      cpu: 95
      error_count: 50
      warning_count: 200
    package_checks:
      - sshd
    apps:
      - name: postgres
        pattern: postgresql
    packages:
      - openssh-server
    network_checks:
      - target: 8.8.8.8
        type: ping
    top_n: 5
    disk_device: sda
    network_interface: eth0
  gcp_mid:
    thresholds:
      ram: 90
      disk: 85
      cpu: 95
      error_count: 50
      warning_count: 200
    package_checks:
      - sshd
    apps: []
    packages:
      - openssh-server
    network_checks:
      - target: 8.8.8.8
        type: ping
    top_n: 5
    disk_device: sda
    network_interface: eth0
  hermes_p1_test:
    thresholds:
      ram: 90
      disk: 85
      cpu: 95
      error_count: 50
      warning_count: 200
    package_checks:
      - cron
      - ssh
      - mariadb
      - exim4
    apps:
      - name: mariadb
        pattern: mariadbd
    packages:
      - mariadb-server
      - openssh-server
      - exim4-base
    network_checks:
      - target: 8.8.8.8
        type: ping
      - target: example.com
        type: dns
    top_n: 5
    disk_device: sda
    network_interface: ens4
settings:
  consecutive_threshold_breaches: 2
